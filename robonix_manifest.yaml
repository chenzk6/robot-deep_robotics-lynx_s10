  #       # Match the effective DWB and velocity-smoother planar ceiling.
  #       # The 75% startup limit is 0.2625 m/s.
  #       max_linear_speed_mps: 0.35
  #       default_percentage: 75
  #       step_percentage: 20
  #       min_percentage: 20
  #     # Project the MID-360 cloud in base_link, remove returns inside the Soma
  #     # footprint, reject isolated scan speckles, and publish the canonical
  #     # /scanner/scan consumed by both Nav2 costmaps and the velocity guard.
  #     # Keeping this conversion inside navigation avoids the incompatible QoS
  #     # and duplicate scan publishers seen with the legacy pcld2lscan service.
  #     scan_projection:
  #       enabled: true
  #       target_frame: base_link
  #       # base_link is at the torso centre; URDF places the lidar 4.5 cm
  #       # forward and 0.10 m above it.
  #       # This band excludes the floor while retaining human legs and torso.
  #       min_height_m: 0.10
