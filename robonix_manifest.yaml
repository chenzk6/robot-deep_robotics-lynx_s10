manifestVersion: 1
catalog:
  name: robonix.robot.deep_robotics.lynx_s10
  version: 0.1.0
  description: DeepRobotics Lynx S10 wheeled-quadruped deployment — native ROS 2 (drdds) chassis control.
  license: Apache-2.0
  tags: [robot, deploy, deep_robotics, lynx_s10, rgbd, vln]
  maintainers:
    - ZLC(mujue) <mujue155@gmail.com>

name: robot-deep_robotics-lynx_s10

env:
  LOG: "INFO"
  # The S10 publishes its native ROS 2 topics (drdds) over the default RMW
  # (Fast DDS). Do NOT set RMW_IMPLEMENTATION here: rmw_zenoh_cpp (used by the
  # Lite3 deploy) would make the S10's topics invisible to this host.
  ROS_DOMAIN_ID: "0"

system:
  atlas:
    listen: 127.0.0.1:50051
    log: info
  soma:
    listen: 127.0.0.1:50091
    # robot_yaml: soma.yaml
    robot_yaml: /home/nvidia/robot-deep_robotics-lynx_s10/soma.yaml
  executor:
    listen: 127.0.0.1:50061
    log: info
  pilot:
    listen: 127.0.0.1:50071
    log: info
    vlm:
      upstream: ${VLM_BASE_URL}
      api_key: ${VLM_API_KEY}
      model: ${VLM_MODEL}
      api_format: openai
  liaison:
    listen: 0.0.0.0:50081
    log: info

primitive:


  - name: lynx_quadruped
    # url: https://github.com/chenzk6/primitive-lynx_quadruped.git
    # branch: main
    # For local development we point straight at the repo on disk; switch back
    # to `url:`/`branch:` once the repo is pushed to GitHub.
    path: /home/nvidia/primitive-lynx_quadruped
    config:
      motion_state_topic: /MOTION_STATE
      motion_info_topic: /MOTION_INFO
      nav_cmd_topic: /NAV_CMD
      gait_topic: /GAIT
      twist_in_topic: /cmd_vel
      odom_topic: /odom
      odom_source_topic: /ODOM   # S10 LIO pose (stamped "map"); re-stamped to odom_frame below
      odom_frame: odom           # frame the /odom capability is published in (continuous)
      base_frame: base_link
      sentinel_timeout_s: 30.0
      speed_mps: 0.20
      ang_speed_rps: 0.60
      default_duration_sec: 1.0
      rotate_tolerance_deg: 3.0
      posture_wait_s: 8.0
      nav_gait: 12290   # 0x3002 平地敏捷步态, recommended for navigation
      # 使用模式切换 over the 本体监控协议 (plain UDP; encryption disabled on this robot).
      usage_mode_ip: 10.21.33.103
      usage_mode_port: 30004   # plain UDP; TCP alt 30003
      usage_mode_transport: udp
      usage_mode: 1            # 1 = 导航模式 (required for /NAV_CMD)


  - name: lynx_imu
    path: /home/nvidia/primitive-lynx_imu
    config:
      imu_topic: /IMU           # /IMU_103 = lidar-internal IMU, alternative
      qos: best_effort
      sentinel_timeout_s: 15.0

  - name: lynx_lidar
    path: /home/nvidia/primitive-lynx_lidar
    config:
      points_topic: /airy_201/points   # front Airy lidar (rslidar_sdk); /airy_202/points = back
      qos: reliable                     # rslidar_sdk publishes RELIABLE
      sentinel_timeout_s: 15.0          # stays Deferred until points actually flow

  # - name: lynx_camera
  #   path: /home/nvidia/primitive-lynx_camera
  #   config:
  #     depth_topic: /DEPTH_IMAGE
  #     qos: reliable
  #     sentinel_timeout_s: 15.0

  # - name: lynx_health
  #   path: /home/nvidia/primitive-lynx_health
  #   config:
  #     battery_topic: /BATTERY_DATA
  #     cpu_topic: /cpu_status
  #     interval_s: 1.0
  #     sentinel_timeout_s: 15.0


service:
  - name: mapping
    url: https://github.com/syswonder/service-map-rbnx
    branch: main
    manifest: package_manifest.jetson-native.yaml
    config:
      algo: rtabmap
      base_frame: base_link
      odom_frame: odom_icp
      use_sim_time: false
      map_id: flour2
      map_mode: mapping  # localization / mapping
      # The bridge composes RTAB-Map's map -> odom_icp localization with the
      # time-aligned ICP and chassis poses, then publishes the sole map -> odom
      # correction consumed by Nav2.
      navigation_odom_bridge: true
      navigation_odom_topic: /odom
      navigation_odom_frame: odom
      # The Airy was rebuilt with POINT_TYPE=XYZIRT, which adds a per-point
      # "timestamp" (FLOAT64, lidar clock). Without it the undeskewed 10 Hz
      # scan smears while the robot moves and ICP registration collapses
      # (corrRatio ~0.025), corrupting the grid into black obstacle patches.
      # Deskew the scan against ICP's own odometry, exactly like the Lite3's
      # MID-360 (which ships per-point timestamps natively).
      deskew_lidar: true
      params_file: config/rtabmap_params.yaml
      sensor_providers:
        lidar3d: lynx_lidar
        imu: lynx_imu
        # odom: lynx_quadruped
        # rgb: orbbec_camera
        # depth: orbbec_camera

  # - name: nav2
  #   url: https://github.com/syswonder/service-navigation-rbnx
  #   branch: main
  #   manifest: package_manifest.jetson-native.yaml
  #   config:

  #     params_file: config/nav2_params_lite3.yml

  #     bt_xml_file: config/navigate.xml
  #     use_sim_time: false
  #     action_wait_s: 90.0
